name: monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      auto:
        default: "false"

permissions:
  contents: read
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore alert history
        uses: actions/cache@v4
        with:
          path: alerted.json
          key: alerted-${{ github.run_id }}
          restore-keys: alerted-

      - name: Run monitor
        timeout-minutes: 57
        continue-on-error: true
        run: python monitor.py
        env:
          PYTHONUNBUFFERED: "1"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          SCHOOL_PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
          SCHOOL_URL: ${{ secrets.SCHOOL_URL }}
          NOTIFY_START: ${{ github.event_name == 'workflow_dispatch' && inputs.auto != 'true' && '1' || '0' }}

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" -le 20261029 ]; then
            gh workflow run monitor.yml --repo ${{ github.repository }} -f auto=true
          fi
