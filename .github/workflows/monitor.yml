name: monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      auto:
        default: "false"

permissions:
  contents: read
  actions: write

# Only one run at a time. A newly queued run waits for the current one to end.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      # Queue the NEXT run right now, at the start of this one.
      # It waits in line and starts the moment this run ends,
      # even if this run is cut off, cancelled or crashes.
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" -le 20261111 ]; then
            gh workflow run monitor.yml --repo ${{ github.repository }} -f auto=true || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        timeout-minutes: 10
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore alert history
        uses: actions/cache@v4
        with:
          path: alerted.json
          key: alerted-${{ github.run_id }}
          restore-keys: alerted-

      - name: Run monitor
        id: monitor
        timeout-minutes: 57
        continue-on-error: true
        run: python monitor.py
        env:
          PYTHONUNBUFFERED: "1"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          SCHOOL_PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
          SCHOOL_URL: ${{ secrets.SCHOOL_URL }}
          NOTIFY_START: ${{ github.event_name == 'workflow_dispatch' && inputs.auto != 'true' && '1' || '0' }}

      - name: Telegram alert if monitor was cut off or crashed
        if: steps.monitor.outcome != 'success'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=⚠️ Driving school monitor was cut off or crashed (result: ${{ steps.monitor.outcome }}). The next run is already queued and will start automatically. If you keep getting this, check the Actions tab on GitHub." \
            > /dev/null || true
